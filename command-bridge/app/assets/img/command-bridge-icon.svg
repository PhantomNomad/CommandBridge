<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Command Bridge">
  <title>Command Bridge</title>
  <rect width="64" height="64" rx="12" fill="#163a5f"/>
  <!-- signal arcs -->
  <g fill="none" stroke="#f0a43a" stroke-width="2.6" stroke-linecap="round">
    <path d="M26.5 14.5a8 8 0 0 1 11 0"/>
    <path d="M29 18a4.2 4.2 0 0 1 6 0"/>
  </g>
  <circle cx="32" cy="21.5" r="1.9" fill="#f0a43a"/>
  <!-- towers -->
  <rect x="14" y="23" width="6" height="27" rx="1" fill="#ffffff"/>
  <rect x="44" y="23" width="6" height="27" rx="1" fill="#ffffff"/>
  <!-- main cable and hangers -->
  <path d="M17 25 Q32 44 47 25" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <g stroke="#ffffff" stroke-width="1.6">
    <line x1="25" y1="32.4" x2="25" y2="40"/>
    <line x1="32" y1="34.6" x2="32" y2="40"/>
    <line x1="39" y1="32.4" x2="39" y2="40"/>
  </g>
  <!-- deck -->
  <rect x="7" y="40" width="50" height="4" rx="1" fill="#ffffff"/>
</svg>
